<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alke Wallet - Enviar Dinero</title>

    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold" href="menu.html">
                Alke Wallet
            </a>

            <button 
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="deposit.html">
                            Depositar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="sendmoney.html">
                            Enviar dinero
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="transactions.html">
                            Transacciones
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logout">
                            Cerrar sesión
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Contenido principal -->
    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card send-card">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-2">
                            💸 Enviar dinero
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Selecciona un contacto y realiza tu transferencia
                        </p>


                        <!-- Saldo -->
                        <div class="alert alert-info text-center">

                            <strong>
                                Saldo disponible:
                            </strong>

                            <span id="currentBalance">
                                $0
                            </span>

                        </div>


                        <!-- Buscar contacto -->
                        <div class="mb-3">

                            <label 
                                for="searchContact" 
                                class="form-label"
                            >
                                Buscar contacto
                            </label>

                            <input 
                                type="text"
                                class="form-control"
                                id="searchContact"
                                placeholder="Escribe el nombre..."
                            >

                        </div>


                        <!-- Lista de contactos -->
                        <div 
                            id="contactList" 
                            class="list-group mb-4"
                        >

                        </div>


                        <!-- Contacto seleccionado -->
                        <div class="mb-3">

                            <label class="form-label">
                                Contacto seleccionado
                            </label>

                            <input 
                                type="text"
                                class="form-control"
                                id="selectedContact"
                                readonly
                                placeholder="Selecciona un contacto"
                            >

                        </div>


                        <!-- Monto -->
                        <div class="mb-3">

                            <label 
                                for="sendAmount" 
                                class="form-label"
                            >
                                Monto a enviar
                            </label>

                            <input 
                                type="number"
                                class="form-control"
                                id="sendAmount"
                                placeholder="Ej: 10000"
                                min="1"
                                required
                            >

                        </div>


                        <!-- Mensaje -->
                        <div id="sendMessage" class="mb-3"></div>


                        <!-- Botón -->
                        <button 
                            type="button"
                            id="sendButton"
                            class="btn btn-primary w-100"
                        >
                            Enviar dinero
                        </button>


                        <!-- Volver -->
                        <div class="text-center mt-3">

                            <a 
                                href="menu.html"
                                class="btn btn-outline-secondary"
                            >
                                Volver al inicio
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Bootstrap JS -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- jQuery -->
    <script 
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>

    <!-- JavaScript propio -->
    <script src="js/sendmoney.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alke Wallet - Depositar</title>

    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold" href="menu.html">
                Alke Wallet
            </a>

            <button 
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="deposit.html">
                            Depositar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="sendmoney.html">
                            Enviar dinero
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="transactions.html">
                            Transacciones
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logout">
                            Cerrar sesión
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Contenido -->
    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card deposit-card">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-3">
                            💰 Depositar dinero
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Agrega dinero a tu billetera
                        </p>


                        <!-- Saldo actual -->
                        <div class="alert alert-info text-center">

                            <strong>
                                Saldo actual:
                            </strong>

                            <span id="currentBalance">
                                $0
                            </span>

                        </div>


                        <!-- Formulario -->
                        <form id="depositForm">

                            <div class="mb-3">

                                <label 
                                    for="depositAmount" 
                                    class="form-label"
                                >
                                    Monto a depositar
                                </label>

                                <input 
                                    type="number"
                                    class="form-control"
                                    id="depositAmount"
                                    placeholder="Ej: 50000"
                                    min="1"
                                    required
                                >

                            </div>


                            <div id="depositMessage" class="mb-3"></div>


                            <button 
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Realizar depósito
                            </button>

                        </form>


                        <div class="text-center mt-3">

                            <a 
                                href="menu.html"
                                class="btn btn-outline-secondary"
                            >
                                Volver al inicio
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Bootstrap JS -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- jQuery -->
    <script 
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>

    <!-- JavaScript propio -->
    <script src="js/deposit.js"></script>

</body>

</html>

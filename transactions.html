<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alke Wallet - Transacciones</title>

    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold" href="menu.html">
                Alke Wallet
            </a>

            <button 
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="deposit.html">
                            Depositar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="sendmoney.html">
                            Enviar dinero
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="transactions.html">
                            Transacciones
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logout">
                            Cerrar sesión
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Contenido -->
    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card transactions-card">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-2">
                            📊 Historial de transacciones
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Revisa los movimientos de tu billetera
                        </p>


                        <!-- Saldo -->
                        <div class="alert alert-info text-center">

                            <strong>
                                Saldo disponible:
                            </strong>

                            <span id="currentBalance">
                                $0
                            </span>

                        </div>


                        <!-- Tabla -->
                        <div class="table-responsive">

                            <table class="table table-hover align-middle">

                                <thead class="table-primary">

                                    <tr>

                                        <th>
                                            Fecha
                                        </th>

                                        <th>
                                            Tipo
                                        </th>

                                        <th>
                                            Descripción
                                        </th>

                                        <th class="text-end">
                                            Monto
                                        </th>

                                    </tr>

                                </thead>

                                <tbody id="transactionList">

                                </tbody>

                            </table>

                        </div>


                        <!-- Mensaje cuando no hay movimientos -->
                        <div 
                            id="emptyMessage" 
                            class="text-center text-muted py-4"
                        >
                        </div>


                        <div class="text-center mt-3">

                            <a 
                                href="menu.html"
                                class="btn btn-outline-secondary"
                            >
                                Volver al inicio
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Bootstrap JS -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- jQuery -->
    <script 
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>

    <!-- JavaScript propio -->
    <script src="js/transactions.js"></script>

</body>

</html>
